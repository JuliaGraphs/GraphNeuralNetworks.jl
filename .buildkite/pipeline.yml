# Temporary pipeline for diagnosing the OpenBLAS segfault on the ROCm agent.
# Not meant to be merged.
steps:
  - label: "Diagnose OpenBLAS segfault on ROCm"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    command: "julia --startup-file=no .buildkite/blas_diagnostic.jl"
    agents:
      queue: "rocm"
      rocmgpu: "*"
    timeout_in_minutes: 60
